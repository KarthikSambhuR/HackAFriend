<!DOCTYPE html>
<html lang="en">
<head> /* ... Head content same as welcome ... */ </head>
<body class="auth-page-body"> <!-- Can reuse auth background -->
    <div class="auth-logo">
        <span class="hack">Hack</span><span class="afriend">AFriend</span>
        <p>Hack . Match . Win</p>
    </div>
    <div class="app-container">
         <div class="auth-card profile-setup-card"> <!-- Specific class for profile setup -->
            <h1>Profile Setup</h1>
             <form action="skills-setup.html" method="GET"> <!-- Simple GET redirect for demo -->
                <input type="text" placeholder="Full Name" required>
                <div class="phone-input">
                    <span>+91</span>
                    <input type="tel" placeholder="Phone No" required>
                </div>
                <input type="text" placeholder="Date of Birth" onfocus="(this.type='date')" onblur="(this.type='text')" required> <!-- Simple date picker trick -->
                <select required>
                    <option value="" disabled selected>Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                    <option value="prefer_not_say">Prefer not to say</option>
                </select>
                <select required>
                    <option value="" disabled selected>College</option>
                    <option value="college1">Example College of Engineering</option>
                    <option value="college2">Another Institute of Technology</option>
                    <!-- Add more college options -->
                </select>
                <select required>
                    <option value="" disabled selected>Course & Branch</option>
                    <option value="cse">Computer Science & Engineering</option>
                    <option value="ece">Electronics & Communication</option>
                    <option value="mech">Mechanical Engineering</option>
                    <!-- Add more options -->
                 </select>
                <input type="number" placeholder="Year of Passing" min="1980" max="2040" required>
                <button type="submit" class="btn btn-dark">Continue</button>
            </form>
        </div>
    </div>
     <script src="script.js"></script>
</body>
</html>

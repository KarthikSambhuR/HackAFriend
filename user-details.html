<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container" style="max-width: 600px;"> <!-- Wider container for more fields -->
        <h1>Complete Your Profile</h1>
        <p>Tell us a bit more about yourself.</p>
        <form id="user-details-form">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"> <!-- Optional? Add required if needed -->
            </div>
             <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>
             <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
             <div class="form-group">
                <label for="college">College:</label>
                 <select id="college" name="college" required>
                     <option value="" disabled selected>Select College...</option>
                     <option value="ajce">Amal Jyothi College Of Engineering</option>
                     <option value="bvm">BVM Holy Cross College, Cherpunkal</option>
                     <option value="cet">College of Engineering Thiruvananthapuram</option>
                     <option value="rit">Rajiv Gandhi Institute of Technology</option>
                     <!-- Add more colleges -->
                 </select>
                 <input type="text" id="college_other" name="college_other" placeholder="Specify if 'Other'" style="display: none; margin-top: 5px;">
            </div>
            <div class="form-group">
                <label for="course">Course:</label>
                <select id="course" name="course" required>
                    <option value="" disabled selected>Select Course...</option>
                    <option value="BTECH">BTech</option>
                    <option value="BCA">BCA</option>
                    <option value="MTECH">MTech</option>
                    <option value="MCA">MCA</option>
                </select>
            </div>
            <!-- Field of Study -->
            <div class="form-group" id="field-of-study-group">
                <label for="field_of_study">Field of Study:</label>
                <select id="field_of_study" name="field_of_study" required>
                    <option value="" disabled selected>Select a course.</option>
                </select>
            </div>
              
              
            <div class="form-group">
                <label for="passing_year">Year of Passing:</label>
                <input type="number" id="passing_year" name="passing_year" min="1980" max="2040" required>
                 <!-- Or use a select dropdown if preferred -->
            </div>
            <div class="form-group">
                <label for="skills">Skills (separate with comma ,):</label>
                <div id="skills-display-area" class="skills-container">
                     <input type="text" id="skills" name="skills_input" placeholder="e.g., Python, JavaScript, SQL">
                </div>
                 <!-- Hidden input to store the actual skills list for form submission -->
                 <input type="hidden" id="skills-hidden" name="skills">
            </div>

            <button type="submit" id="save-details-button">Save Details & Go to Dashboard</button>
            <div id="error-message" class="error-message"></div>
        </form>
         <div class="links">
            <button id="logout-button-alt" style="background: #aaa; width: auto; padding: 8px 15px;">Logout</button>
        </div>
    </div>

    <script>
        const courseSelect = document.getElementById('course');
        const fieldGroup = document.getElementById('field-of-study-group');
        const fieldSelect = document.getElementById('field_of_study');
        
        // Field options by course type
        const fieldsByCourse = {
          'BTECH': [ // BTech
            { id: 3, name: "Artificial Intelligence & Data Science" },
            { id: 4, name: "Chemical Engineering" },
            { id: 5, name: "Civil Engineering" },
            { id: 6, name: "Computer Science and Engineering" },
            { id: 7, name: "Computer Science & Engineering (Artificial Intelligence)" },
            { id: 8, name: "Computer Science and Engineering (Cyber Security)" },
            { id: 9, name: "Electronics & Communication Engineering" },
            { id: 22, name: "Electrical and Computer Engineering" },
            { id: 10, name: "Electrical & Electronics Engineering" },
            { id: 11, name: "Food Technology" },
            { id: 12, name: "Information Technology" },
            { id: 13, name: "Mechanical Engineering" },
            { id: 14, name: "Mechanical Engineering (Automobile)" },
            { id: 15, name: "Metallurgical & Materials Engineering" }
          ],
          'MTECH': [ // MTech
            { id: 16, name: "Structural Engineering & Construction Management" },
            { id: 17, name: "Computer Science and Engineering" },
            { id: 18, name: "Energy Systems" },
            { id: 19, name: "VLSI Design and Embedded Systems" },
            { id: 20, name: "Electric Vehicle Technology" },
            { id: 21, name: "Environmental Engineering" }
          ]
        };
        
        // Toggle and populate field dropdown
        courseSelect.addEventListener('change', () => {
          const selectedCourse = courseSelect.value;
          
          if (selectedCourse === 'BCA' || selectedCourse === 'MCA') {
            // Hide field for BCA and MCA
            fieldGroup.style.display = 'none';
            fieldSelect.required = false;
            fieldSelect.innerHTML = '';
          } else {
            fieldGroup.style.display = 'block';
            fieldSelect.required = true;
        
            const fields = fieldsByCourse[selectedCourse] || [];
            fieldSelect.innerHTML = `<option value="" disabled selected>Select Field...</option>`;
            fields.forEach(f => {
              const opt = document.createElement('option');
              opt.value = f.id;
              opt.textContent = f.name;
              fieldSelect.appendChild(opt);
            });
          }
        });
    </script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <!-- User Details Logic -->
    <script type="module" src="./js/userDetails.js"></script>
</body>
</html>

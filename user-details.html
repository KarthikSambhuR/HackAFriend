<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container" style="max-width: 600px;"> <!-- Wider container for more fields -->
        <h1>Complete Your Profile</h1>
        <p>Tell us a bit more about yourself.</p>
        <form id="user-details-form">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"> <!-- Optional? Add required if needed -->
            </div>
             <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>
             <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                    <option value="prefer_not_say">Prefer not to say</option>
                </select>
            </div>
             <div class="form-group">
                <label for="college">College:</label>
                 <select id="college" name="college" required>
                     <option value="" disabled selected>Select College...</option>
                     <option value="college_a">College A</option>
                     <option value="college_b">College B</option>
                     <option value="college_c">College C</option>
                     <option value="other">Other (Specify Below)</option>
                     <!-- Add more colleges -->
                 </select>
                 <input type="text" id="college_other" name="college_other" placeholder="Specify if 'Other'" style="display: none; margin-top: 5px;">
            </div>
            <div class="form-group">
                <label for="course">Course:</label>
                 <select id="course" name="course" required>
                     <option value="" disabled selected>Select Course...</option>
                     <option value="course_x">Course X (e.g., B.Tech)</option>
                     <option value="course_y">Course Y (e.g., B.Sc)</option>
                     <option value="course_z">Course Z (e.g., M.A)</option>
                     <!-- Add more courses -->
                 </select>
            </div>
            <div class="form-group">
                <label for="field_of_study">Field of Study:</label>
                 <select id="field_of_study" name="field_of_study" required>
                     <option value="" disabled selected>Select Field...</option>
                     <option value="cs">Computer Science</option>
                     <option value="ee">Electrical Engineering</option>
                     <option value="mech">Mechanical Engineering</option>
                     <option value="arts">Arts</option>
                     <option value="comm">Commerce</option>
                     <!-- Add more fields -->
                 </select>
            </div>
            <div class="form-group">
                <label for="passing_year">Year of Passing:</label>
                <input type="number" id="passing_year" name="passing_year" min="1980" max="2040" required>
                 <!-- Or use a select dropdown if preferred -->
            </div>
            <div class="form-group">
                <label for="skills">Skills (separate with comma ,):</label>
                <div id="skills-display-area" class="skills-container">
                     <input type="text" id="skills" name="skills_input" placeholder="e.g., Python, JavaScript, SQL">
                </div>
                 <!-- Hidden input to store the actual skills list for form submission -->
                 <input type="hidden" id="skills-hidden" name="skills">
            </div>

            <button type="submit" id="save-details-button">Save Details & Go to Dashboard</button>
            <div id="error-message" class="error-message"></div>
        </form>
         <div class="links">
            <button id="logout-button-alt" style="background: #aaa; width: auto; padding: 8px 15px;">Logout</button>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <!-- User Details Logic -->
    <script type="module" src="./js/userDetails.js"></script>
</body>
</html>

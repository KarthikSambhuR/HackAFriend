<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackAFriend - Filters</title>
    <link rel="stylesheet" href="style.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="filter-page"> <!-- Optional specific body class -->
    <div class="app-container">
         <header class="filter-header">
             <a href="search.html" class="back-button"><</a> <!-- Link back -->
             <h1>Filters</h1>
             <button class="reset-button">Reset</button> <!-- JS needed -->
         </header>

         <div class="filter-section">
             <h2>Skills</h2>
             <div class="filter-tags skills-tags">
                 <button class="filter-tag skill-tag">Design</button>
                 <button class="filter-tag skill-tag">Python</button>
                 <button class="filter-tag skill-tag">JavaScript</button>
                 <button class="filter-tag skill-tag">C</button>
                 <button class="filter-tag skill-tag">C++</button>
                 <button class="filter-tag skill-tag selected">HTML</button> <!-- Example selected -->
                 <button class="filter-tag skill-tag">C#</button>
                 <button class="filter-tag skill-tag">Java</button>
                 <button class="filter-tag skill-tag">CSS</button>
                 <button class="filter-tag skill-tag">Presentation</button>
                 <button class="filter-tag skill-tag selected">UI/UX</button> <!-- Example selected -->
                 <button class="filter-tag skill-tag">Robotics</button>
                 <button class="filter-tag skill-tag">Public Speaking</button>
                 <button class="filter-tag skill-tag">Software</button>
                 <button class="filter-tag skill-tag">Hardware</button>
                 <!-- JS needed for selection toggle -->
             </div>
         </div>

         <div class="filter-section">
             <h2>Role</h2>
             <div class="filter-tags role-tags">
                  <button class="filter-tag role-tag selected">Developer</button> <!-- Example selected -->
                  <button class="filter-tag role-tag">Ideator</button>
                  <button class="filter-tag role-tag">Pitcher</button>
                  <button class="filter-tag role-tag">Designer</button>
             </div>
         </div>

         <div class="filter-section">
            <h2>Gender</h2>
             <div class="filter-tags gender-tags">
                  <button class="filter-tag gender-tag selected">Male</button> <!-- Example selected -->
                  <button class="filter-tag gender-tag">Female</button>
                  <button class="filter-tag gender-tag">Other</button>
             </div>
        </div>

         <div class="filter-section">
             <h2>College</h2>
             <select>
                 <option value="" disabled selected>Select from dropdown</option>
                 <option value="college1">Example College of Engineering</option>
                 <option value="college2">Another Institute of Technology</option>
                 <option value="college3">University of Examples</option>
                 <!-- Add more colleges -->
             </select>
         </div>

          <div class="filter-section">
             <h2>Age</h2>
             <div class="age-slider">
                 <!-- Basic representation - actual slider needs JS library or complex CSS/JS -->
                 <input type="range" min="0" max="100" value="18" id="age-min">
                 <input type="range" min="0" max="100" value="22" id="age-max">
                 <div class="age-labels"><span>0</span> <span>18</span> <span>22</span> <span>100</span></div>
             </div>
         </div>

         <a href="search.html" class="btn btn-apply-filters">Apply Filters</a> <!-- Link back to search -->
    </div><!-- End .app-container -->

    <!-- No Nav Bar on Filters page -->

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackAFriend - Welcome</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page-body">
     <div class="auth-logo">
        <span class="hack">Hack</span><span class="afriend">AFriend</span>
        <p>Hack . Match . Win</p>
    </div>
     <div class="app-container">
         <div class="auth-card">
            <h1>Sign Up</h1>
             <form action="profile-setup.html" method="GET"> <!-- Simple GET redirect for demo -->
                <input type="email" placeholder="Email" required>
                <input type="text" placeholder="Username" required>
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>
                <button type="submit" onclick="window.location.href = '/home.html'" class="btn btn-dark">Sign Up</button>
            </form>
             <p style="margin-top: 15px; font-size: 14px;">Already have an account? <a href="login.html" style="color: var(--primary-green); text-decoration: none;">Login</a></p>
        </div>
    </div>
     <script src="script.js"></script>
</body>
</html>

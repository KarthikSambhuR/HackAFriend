<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing...</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <h1>Processing Your Request</h1>
        <div id="message" class="info-message" style="display: block;">Please wait...</div>

        <!-- Password Reset Form (hidden by default) -->
        <form id="reset-password-form" style="display: none;">
            <h2>Reset Your Password</h2>
            <p>Enter your new password below.</p>
            <div class="form-group">
                <label for="new-password">New Password:</label>
                <input type="password" id="new-password" required minlength="6">
            </div>
             <div class="form-group">
                <label for="confirm-new-password">Confirm New Password:</label>
                <input type="password" id="confirm-new-password" required minlength="6">
            </div>
            <button type="submit" id="reset-pw-button">Reset Password</button>
            <div id="reset-error-message" class="error-message"></div>
        </form>
        <!-- End Password Reset Form -->

        <div class="links">
            <a href="login" id="login-link" style="display: none;">Go to Login</a>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <!-- Verification Logic -->
    <script type="module" src="./js/verifyEmail.js"></script>
</body>
</html>
